[package]
name = "image_meta_analyzer"
version = "1.0.0"
edition = "2021"
description = "A security-focused image metadata analyzer"
authors = ["Your Name"]

[[bin]]
name = "image_meta_analyzer"
path = "src/main.rs"

[dependencies]
# EXIF parsing
# kamadak-exif = "0.5" Change to latest version
kamadak-exif = "0.6.1"

# Image format detection and basic info
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "tiff", "bmp"] }

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Colored terminal output
colored = "2"

# Serialization (for JSON report output)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# File hashing (SHA-256, MD5)
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
regex = "1"

# Time formatting
chrono = { version = "0.4", features = ["serde"] }

# Human-readable file sizes
humansize = "2"

# GPS coordinate formatting (DMS)
# (implemented manually, no extra dep needed)

[profile.release]
opt-level = 3
strip = true
